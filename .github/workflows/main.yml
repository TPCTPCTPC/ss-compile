name: Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      
      - name: Running Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Sing-Box Builds
        run: |
          set -euo pipefail
          stable_version=$(./sing-box version)
          alpha_version=$(./sing-box-alpha version)
          echo "$stable_version"
          echo "$alpha_version"
          grep -Eq -- '^sing-box version [0-9]+\.[0-9]+\.[0-9]+' <<< "$stable_version"
          if grep -Eq -- '-(alpha|beta|rc)' <<< "$stable_version"; then
            echo "Stable sing-box unexpectedly reports a prerelease version" >&2
            exit 1
          fi
          grep -Eq -- '-alpha\.' <<< "$alpha_version"
        
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Latest Build"
          body: |
            Built binaries (v3 optimized, stripped):
            - Shadowsocks-rust
            - Shadow-TLS
            - Realm (New)
            - AnyTLS server & client
            - Mosdns
            - Sing-Box
            - Sing-Box Alpha (no optional build tags)
            - Node Exporter & Blackbox Exporter
          files: |
            ssserver
            shadow-tls
            realm
            anytls-server
            anytls-client
            node_exporter
            blackbox_exporter
            mosdns
            sing-box
            sing-box-alpha
          overwrite: true
